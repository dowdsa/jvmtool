name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/jm-desktop/frontend/package-lock.json
      - name: Build desktop frontend
        working-directory: desktop/jm-desktop/frontend
        run: npm ci && npm run build

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux_amd64
          - linux_arm64
          - darwin_amd64
          - darwin_arm64
          - windows_amd64
          - windows_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Parse platform
        id: parse
        run: |
          IFS='_' read -r os arch <<< "${{ matrix.platform }}"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          if [ "$os" = "windows" ]; then
            echo "ext=.exe" >> "$GITHUB_OUTPUT"
          else
            echo "ext=" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ steps.parse.outputs.os }} GOARCH=${{ steps.parse.outputs.arch }} \
            go build -trimpath -ldflags="-s -w -X jm/pkg/version.Version=${{ steps.parse.outputs.version }}" \
            -o "jm_${{ matrix.platform }}${{ steps.parse.outputs.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jm_${{ matrix.platform }}
          path: jm_${{ matrix.platform }}${{ steps.parse.outputs.ext }}
          if-no-files-found: error

  desktop:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build desktop NSIS installer (Windows amd64)
        working-directory: desktop/jm-desktop
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          $ver = "$env:GITHUB_REF_NAME".TrimStart('v')
          wails build -platform windows/amd64 -nsis -skipbindings -clean -ldflags "-X jm/pkg/version.Version=$ver"
          Rename-Item "build\bin\jm-desktop-amd64-installer.exe" "jm-desktop_windows_amd64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: jm-desktop_windows_amd64
          path: desktop/jm-desktop/build/bin/jm-desktop_windows_amd64.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: [quality, build, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum jm_* jm-desktop_* > SHA256SUMS.txt

      - name: Extract changelog section
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \[" ver "\]" { insec=1; next }
            insec && $0 ~ "^## \[" { insec=0 }
            insec { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "（CHANGELOG.md 中未找到 [${VER}] 章节）" > release-notes.md; fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
