name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync:
    name: Mirror to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "Gitee credentials not configured, skipping."
            exit 0
          fi
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_USERNAME}/jvmtool.git"
          # 推送所有分支和 tag（不用 --mirror 以避免推送 refs/remotes/origin/* 隐藏引用）
          git push gitee --force "refs/heads/*:refs/heads/*" "refs/tags/*:refs/tags/*"

      - name: Create Gitee release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "Gitee credentials not configured, skipping release creation."
            exit 0
          fi
          python3 scripts/gitee_release.py "$GITEE_USERNAME" "$GITEE_TOKEN" "$GITHUB_REF_NAME"
