<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="steam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- 蒸汽 -->
  <path d="M196 148 q-14 -26 6 -42" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M256 138 q-14 -30 8 -48" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M316 148 q-14 -26 6 -42" stroke="url(#steam)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- 咖啡杯 -->
  <g filter="url(#shadow)">
    <path d="M156 196 h200 a28 28 0 0 1 28 28 v72 a96 96 0 0 1 -96 96 h-64 a96 96 0 0 1 -96 -96 v-72 a28 28 0 0 1 28 -28 z"
          fill="url(#cup)"/>
    <!-- 杯柄 -->
    <path d="M356 232 a40 40 0 0 1 0 80" stroke="#ffffff" stroke-width="26" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 杯身 M 图案 -->
  <g fill="#1e3a8a">
    <path d="M212 300 v-64 l28 40 28-40 v64 h-18 v-34 l-10 14 -10-14 v34 z"/>
    <path d="M312 300 v-64 l28 40 28-40 v64 h-18 v-34 l-10 14 -10-14 v34 z" opacity="0.55"/>
  </g>

  <!-- 文字 jm -->
  <text x="256" y="452" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" letter-spacing="8">
    jm
  </text>
</svg>
